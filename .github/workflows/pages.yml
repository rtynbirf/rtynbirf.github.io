name: "Deploy корневого сайта"

# Статический корневой сайт аккаунта. Образец: singulyar pages.yml
# («Pin Pages source to workflow — гонка legacy-main устранена»).
# Легаси-сборщик падал мгновенно на переходном конвейере GitHub; workflow-сборка
# детерминированна: checkout -> ort-wasm glue -> upload-pages-artifact -> deploy-pages.
# Пины по SHA — учитель OpenSSF Scorecard (ПУЛЬС v2).
#
# Волна ×5 (2026-11-09):
# 1. Триггер push был битым: `branches: ain]` — ветки с таким именем не существует,
#    деплой сайта на push был мёртв (жил молча, только ручной dispatch).
#    Починено на честные ASCII-байты: [main].
# 2. ort-wasm одна копия (П52 · singulyar#64 · docs/ORT-WASM-DEDUP.md):
#    бинарь больше НЕ хранится в дереве этого репо (−21,6 МБ на дерево GitHub).
#    На сборке файл склеивается из канонической копии singulyar@rumu (SHA-пин)
#    и проверяется sha256 — офлайн-старт плеера обеспечивается артефактом деплоя.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Склейка ort-wasm (одна копия из singulyar@rumu — П52, дедуп)
        run: |
          set -euo pipefail
          mkdir -p vendor/ort
          SRC="https://raw.githubusercontent.com/rtynbirf/singulyar/d95ad5a42d0053fafa3fcf2202d885ded0500476/vendor/ort"
          curl -fsSL "$SRC/ort-wasm-simd-threaded.jsep.wasm" -o vendor/ort/ort-wasm-simd-threaded.jsep.wasm
          curl -fsSL "$SRC/ort-wasm-simd-threaded.jsep.mjs"  -o vendor/ort/ort-wasm-simd-threaded.jsep.mjs
          echo "c46655e8a94afc45338d4cb2b840475f88e5012d524509916e505079c00bfa39  ort-wasm-simd-threaded.jsep.wasm" > vendor/ort/SHA256SUMS
          echo "08fb86ec433c78bfb032c5d84a68b8e8e5a8d81268fa39e24314179a5767a5b9  ort-wasm-simd-threaded.jsep.mjs" >> vendor/ort/SHA256SUMS
          (cd vendor/ort && sha256sum -c SHA256SUMS)
          test "$(stat -c%s vendor/ort/ort-wasm-simd-threaded.jsep.wasm)" -eq 21596019
          echo "офлайн-гейт: ort-wasm в артефакте, sha256 и размер сошлись (одна копия)"

      - name: Upload статического сайта
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy в GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
