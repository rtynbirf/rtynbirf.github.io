name: "Deploy корневого сайта"

# Статический корневой сайт аккаунта. Образец: singulyar pages.yml
# («Pin Pages source to workflow — гонка legacy-main устранена»).
# Легаси-сборщик падал мгновенно на переходном конвейере GitHub; workflow-сборка
# детерминированна: checkout -> upload-pages-artifact -> deploy-pages.
# Пины по SHA — учитель OpenSSF Scorecard (ПУЛЬС v2).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload статического сайта
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .

      - name: Deploy в GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
